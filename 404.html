<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Page not found — Sabarinathan Ragunathan</title>
		<meta name="robots" content="noindex, follow" />
		<meta name="theme-color" content="#000000" />
		<link
			rel="icon"
			type="image/svg+xml"
			href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23000000'/%3E%3Ctext x='32' y='42' font-family='-apple-system,Inter,Helvetica,Arial,sans-serif' font-size='26' font-weight='600' letter-spacing='-1' fill='%23f5f5f7' text-anchor='middle'%3ESR%3C/text%3E%3C/svg%3E" />
		<script>
			try {
				var r = document.documentElement;
				if (localStorage.getItem('theme') === 'light') r.classList.add('light-theme');
				r.classList.add('accent-' + (localStorage.getItem('accent') || 'cyan'));
			} catch (e) {}
		</script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Inter+Tight:wght@600&family=JetBrains+Mono:wght@400;500&display=swap"
			rel="stylesheet" />
		<link rel="stylesheet" href="css/styles.css" />
		<style>
			body {
				display: flex;
				align-items: center;
				justify-content: center;
				min-height: 100svh;
				padding: 24px;
			}
			.nf {
				max-width: 560px;
				text-align: center;
			}
			.nf .code {
				display: inline-block;
				font-family: var(--font-mono);
				font-size: 13px;
				color: var(--text-2);
				padding: 6px 14px;
				border: 1px solid var(--line);
				border-radius: 980px;
				background: var(--chip);
				margin-bottom: 28px;
			}
			.nf h1 {
				font-size: clamp(2.4rem, 6vw, 3.6rem);
				letter-spacing: -0.04em;
				line-height: 1.05;
				margin-bottom: 18px;
			}
			.nf p {
				color: var(--text-2);
				font-size: 18px;
				line-height: 1.5;
				margin-bottom: 32px;
			}
			.nf .links {
				display: flex;
				gap: 28px;
				justify-content: center;
				flex-wrap: wrap;
			}
		</style>
	</head>
	<body>
		<main class="nf">
			<span class="code">404 — not found</span>
			<h1>This page doesn't exist.</h1>
			<p>
				The link may be old or mistyped. Everything lives on the home
				page.
			</p>
			<div class="links">
				<a href="/" class="link-arrow">Back to home</a>
				<a href="/resume" class="link-arrow">Resume</a>
			</div>
		</main>
	</body>
</html>
